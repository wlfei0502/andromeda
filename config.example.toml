api_key = "sk-..."
# base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
listen = "127.0.0.1:8080"
tool_timeout_secs = 60
follow_up_policy = "noop"   # or "example_order"
log_level = "info"          # error | warn | info | debug | trace，或 EnvFilter 指令

[persist]
enabled = true
data_dir = "./data"
# Empty → server generates a UUID at startup (written to checkpoint.owner_id).
instance_id = ""

[context]
summarize_threshold_tokens = 80000
keep_last_messages = 24
max_context_tokens = 120000

[guards]
# 0 disables that guard. Counts are per run.
max_llm_rounds = 200
max_run_wall_secs = 7200
max_follow_up_rounds = 8
max_noop_llm_rounds = 5

[subagents]
max_concurrent_subagents = 2
subagent_timeout_secs = 900
